name: AI Code Review
description: Runs the code reviewer and emits pass/fail plus a ready-to-upsert comment body.

inputs:
  title:
    description: Pull request title
    required: false
    default: ""
  description:
    description: Pull request description/body
    required: false
    default: ""
  diff-path:
    description: Path to a file containing the unified diff content
    required: true
  openrouter-api-key:
    description: OpenRouter API key
    required: true

outputs:
  passed:
    description: "true when all scores are >= 7, else false"
    value: ${{ steps.render.outputs.passed }}
  comment-body-path:
    description: Path to a file containing the markdown comment body with marker, score table, and summary
    value: ${{ steps.render.outputs.comment-body-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install reviewer dependencies
      shell: bash
      working-directory: packages/code-reviewer
      run: |
        set -euo pipefail
        npm ci

    - name: Run AI reviewer
      id: review
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        PR_TITLE: ${{ inputs.title }}
        PR_DESCRIPTION: ${{ inputs.description }}
        DIFF_PATH: ${{ inputs.diff-path }}
      working-directory: packages/code-reviewer
      run: |
        set -euo pipefail

        RESULT_FILE="${RUNNER_TEMP}/ai-cr-review.json"

        cat "$DIFF_PATH" | npm run --silent start -- --title "$PR_TITLE" --description "$PR_DESCRIPTION" > "$RESULT_FILE"

        echo "review-json-path=$RESULT_FILE" >> "$GITHUB_OUTPUT"

    - name: Compute pass/fail and render comment
      id: render
      shell: bash
      env:
        REVIEW_JSON_PATH: ${{ steps.review.outputs.review-json-path }}
        BODY_FILE: ${{ runner.temp }}/ai-cr-comment.md
      run: |
        set -euo pipefail

        node <<'NODE'
        const fs = require("node:fs");

        const reviewPath = process.env.REVIEW_JSON_PATH;
        const bodyPath = process.env.BODY_FILE;
        const outputPath = process.env.GITHUB_OUTPUT;

        if (!reviewPath || !bodyPath || !outputPath) {
          throw new Error("Missing required environment for render step");
        }

        const raw = fs.readFileSync(reviewPath, "utf8");
        const parsed = JSON.parse(raw);

        const scores = parsed.scores ?? {};
        const findings = Array.isArray(parsed.findings) ? parsed.findings : [];
        const recommendations = Array.isArray(parsed.recommendations) ? parsed.recommendations : [];
        const ordered = [
          ["Correctness", scores.correctness],
          ["Readability", scores.readability],
          ["Test coverage", scores.testCoverage],
          ["Security", scores.security],
          ["Error handling", scores.errorHandling],
          ["Maintainability", scores.maintainability],
          ["Consistency", scores.consistency],
        ];

        for (const [label, value] of ordered) {
          if (!Number.isInteger(value) || value < 1 || value > 10) {
            throw new Error(`Invalid score for ${label}: ${value}`);
          }
        }

        const passed = ordered.every(([, value]) => value >= 7);
        const verdict = passed ? "PASS" : "FAIL";
        const summary = typeof parsed.summary === "string" ? parsed.summary.trim() : "";
        const highRiskFindings = findings.filter((finding) => finding?.severity === "high" || finding?.severity === "critical");

        const findingLines = findings.length
          ? findings.map((finding, index) => {
              const fileSuffix = finding.filePath ? ` (${finding.filePath})` : "";
              const severity = typeof finding.severity === "string" ? finding.severity.toUpperCase() : "UNKNOWN";
              const criterion = typeof finding.criterion === "string" ? finding.criterion : "unknown";
              const title = typeof finding.title === "string" ? finding.title : "Untitled finding";
              const evidence = typeof finding.evidence === "string" ? finding.evidence : "No evidence provided.";
              const recommendation =
                typeof finding.recommendation === "string" ? finding.recommendation : "No recommendation provided.";

              return [
                `${index + 1}. [${severity}] ${title}${fileSuffix}`,
                `   - Criterion: ${criterion}`,
                `   - Evidence: ${evidence}`,
                `   - Recommendation: ${recommendation}`,
              ].join("\n");
            })
          : ["No concrete findings were provided by the model."];

        const recommendationLines = recommendations.length
          ? recommendations.map((item, index) => `${index + 1}. ${item}`)
          : ["1. No prioritized recommendations were provided by the model."];

        const riskLines = highRiskFindings.length
          ? highRiskFindings.map((finding) => {
              const fileSuffix = finding.filePath ? ` (${finding.filePath})` : "";
              const title = typeof finding.title === "string" ? finding.title : "Untitled risk";
              return `- [${String(finding.severity).toUpperCase()}] ${title}${fileSuffix}`;
            })
          : ["- No high-severity risks detected."];

        const lines = [
          "<!-- ai-cr:summary -->",
          "## AI Code Review",
          "",
          `**Verdict:** ${verdict} (threshold: all criteria >= 7)`,
          "",
          "| Criterion | Score |",
          "| --- | ---: |",
          ...ordered.map(([label, value]) => `| ${label} | ${value}/10 |`),
          "",
          "### Summary",
          summary || "No summary provided by the model.",
          "",
          "### Key Risks",
          ...riskLines,
          "",
          "### Findings",
          ...findingLines,
          "",
          "### Suggested Fixes",
          ...recommendationLines,
          "",
        ];

        fs.writeFileSync(bodyPath, lines.join("\n"), "utf8");

        const out = [];
        out.push(`passed=${passed ? "true" : "false"}`);
        out.push(`comment-body-path=${bodyPath}`);

        fs.appendFileSync(outputPath, `${out.join("\n")}\n`, "utf8");
        NODE